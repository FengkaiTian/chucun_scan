<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" width="860" height="640" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="860" height="640" rx="16" fill="#ffffff"/>
  <text x="40" y="48" font-size="22" font-weight="700" fill="#111827">标普500 主推信号 · 每日流程</text>
  <text x="40" y="74" font-size="13" fill="#6b7280">每个交易日收盘后运行 daily_scan.py，生成网页并推送到 GitHub Pages</text>

  <!-- 1 数据 -->
  <rect x="40" y="100" width="500" height="58" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="124" font-size="14" font-weight="700" fill="#111827">① 数据</text>
  <text x="60" y="145" font-size="13" fill="#4b5563">当日标普500 成分股 · 最近 15 个月日线 · VIX</text>
  <line x1="290" y1="158" x2="290" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 2 基础信号 -->
  <rect x="40" y="182" width="500" height="76" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="206" font-size="14" font-weight="700" fill="#111827">② 基础信号（超卖、跌势减弱）</text>
  <text x="60" y="227" font-size="13" fill="#4b5563">MACD 柱在零轴下方，连续 3 根抬高</text>
  <text x="60" y="246" font-size="13" fill="#4b5563">前一天 RSI14 &lt; 30，今天回升</text>
  <line x1="290" y1="258" x2="290" y2="280" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 3 主推 -->
  <rect x="40" y="282" width="500" height="76" rx="10" fill="#eff4ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="306" font-size="14" font-weight="700" fill="#1d4ed8">③ 主推触发</text>
  <text x="60" y="327" font-size="13" fill="#1e3a8a">今天低开：开盘价 &lt; 昨天收盘价</text>
  <text x="60" y="346" font-size="13" fill="#1e3a8a">这只股票 5 天内第一次出基础信号 · 不看 VIX</text>
  <line x1="290" y1="358" x2="290" y2="380" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 4 分档 -->
  <rect x="40" y="382" width="500" height="112" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="406" font-size="14" font-weight="700" fill="#111827">④ 分档（个股深低开 + 市场恐慌，各 1 分）</text>
  <rect x="60" y="418" width="26" height="20" rx="5" fill="#dc2626"/><text x="73" y="433" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">A</text>
  <text x="96" y="433" font-size="13" fill="#374151">两项都有 · 优先买</text>
  <rect x="60" y="444" width="26" height="20" rx="5" fill="#2563eb"/><text x="73" y="459" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">B</text>
  <text x="96" y="459" font-size="13" fill="#374151">只有一项 · 正常买</text>
  <rect x="60" y="470" width="26" height="20" rx="5" fill="#e5e7eb"/><text x="73" y="485" font-size="12" font-weight="800" fill="#4b5563" text-anchor="middle">C</text>
  <text x="96" y="485" font-size="13" fill="#374151">都没有 · 只观察</text>
  <text x="290" y="433" font-size="11.5" fill="#6b7280">深低开 = 低开 ≥1% 或 开盘 &lt; 昨日最低</text>
  <text x="290" y="452" font-size="11.5" fill="#6b7280">恐慌 = VIX ≥ 25 或 当天主推 ≥ 5 只</text>
  <line x1="290" y1="494" x2="290" y2="516" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 5 交易 -->
  <rect x="40" y="518" width="500" height="58" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="60" y="542" font-size="14" font-weight="700" fill="#991b1b">⑤ 交易</text>
  <text x="60" y="563" font-size="13" fill="#7f1d1d">信号次日收盘买入 → 持有 10 个交易日 → 收盘卖出</text>

  <!-- 右侧：回测 -->
  <rect x="570" y="100" width="250" height="300" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="590" y="126" font-size="14" font-weight="700" fill="#111827">回测（扣 0.10% 成本）</text>
  <text x="590" y="146" font-size="11.5" fill="#6b7280">无幸存者偏差的历史成分股</text>
  <text x="590" y="176" font-size="12.5" fill="#374151">2000–2025 每年约 120 笔</text>
  <text x="590" y="202" font-size="12.5" fill="#374151"><tspan font-weight="800" fill="#dc2626">A</tspan>  每笔 +2.94% · 胜率 67%</text>
  <text x="590" y="224" font-size="12.5" fill="#374151"><tspan font-weight="800" fill="#2563eb">B</tspan>  每笔 +1.30% · 胜率 57%</text>
  <text x="590" y="246" font-size="12.5" fill="#374151"><tspan font-weight="800" fill="#6b7280">C</tspan>  每笔 −0.05% · 胜率 53%</text>
  <line x1="590" y1="264" x2="800" y2="264" stroke="#e5e7eb"/>
  <text x="590" y="288" font-size="12.5" fill="#374151">2026（检验）</text>
  <text x="590" y="310" font-size="12.5" fill="#374151">A+B 93 笔 · 每笔 +2.99% · 胜率 71%</text>
  <line x1="590" y1="330" x2="800" y2="330" stroke="#e5e7eb"/>
  <text x="590" y="354" font-size="11.5" fill="#6b7280">对照：随便买一只成分股</text>
  <text x="590" y="374" font-size="11.5" fill="#6b7280">同样拿 10 天每笔 +0.40%</text>

  <!-- 右侧：输出 -->
  <rect x="570" y="420" width="250" height="156" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="590" y="446" font-size="14" font-weight="700" fill="#111827">输出</text>
  <text x="590" y="472" font-size="12.5" fill="#374151">网页：今日主推（A/B/C）</text>
  <text x="590" y="494" font-size="12.5" fill="#374151">网页：最近 20 条主推回放</text>
  <text x="590" y="516" font-size="12.5" fill="#374151">picks_history.json 选股记录</text>
  <text x="590" y="538" font-size="12.5" fill="#374151">analysis/private 研究脚本与结果</text>
  <text x="590" y="560" font-size="11.5" fill="#6b7280">胜率口径：扣费后涨超 0 算赢</text>

  <text x="40" y="612" font-size="11.5" fill="#9ca3af">仅供研究参考，不构成投资建议。历史回测不代表未来表现。· 规则 2026-11-19 起使用</text>
</svg>
