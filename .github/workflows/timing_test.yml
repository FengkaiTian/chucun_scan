name: timing-test
on:
  push:
    paths: [timing/FROZEN]      # 策略冻结后才触发；timing/eval.py 自带"只跑一次"保护
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install yfinance pandas numpy requests pyarrow xlrd lxml
      - run: python -m timing.eval
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results
          git commit -m "results: one-shot S&P 500 timing test (2026 primary, 1961-1997 reference)"
          git push
