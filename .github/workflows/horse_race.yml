name: horse_race_data
on:
  push:
    paths: [horse_race/fetch.py, .github/workflows/horse_race.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install yfinance pandas lxml requests pyarrow
      - run: python -m horse_race.fetch
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/hr_*.parquet
          git commit -m "data: horse-race OHLCV for all 2008-2026 S&P 500 members"
          git push
