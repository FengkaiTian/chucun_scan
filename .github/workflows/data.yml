name: data
on:
  push:
    paths: [data_pipeline.py, .github/workflows/data.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install yfinance pandas lxml requests pyarrow
      - run: python data_pipeline.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git commit -m "data: point-in-time S&P 500 membership + 2008-2025 daily prices"
          git push
